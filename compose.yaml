services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: record_service
      MYSQL_USER: record_app
      MYSQL_PASSWORD: local-record-password
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: